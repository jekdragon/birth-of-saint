<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Рождение святого — Roguelike</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0a0a0f;
            color: #e0d8c8;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 1024px;
            height: 768px;
            margin: 20px auto;
            border: 2px solid #333;
            border-radius: 4px;
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 10;
        }
        #loading h1 {
            font-size: 28px;
            color: #c8a86e;
            margin-bottom: 10px;
        }
        #loading p {
            font-size: 14px;
            color: #888;
        }
        #loading .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #c8a86e;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .controls {
            text-align: center;
            margin: 10px;
            font-size: 13px;
            color: #666;
        }
        .controls span {
            margin: 0 8px;
            color: #888;
        }
        .header {
            text-align: center;
            margin: 15px 0 5px;
        }
        .header h1 {
            font-size: 24px;
            color: #c8a86e;
            text-shadow: 0 0 10px rgba(200, 168, 110, 0.3);
        }
        .header p {
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>✝ Рождение святого ✝</h1>
        <p>Biblical Horror Roguelike — Vampire Survivors Clone</p>
    </div>

    <div id="game-container">
        <div id="loading">
            <h1>✝ Рождение святого ✝</h1>
            <div class="spinner"></div>
            <p>Загрузка...</p>
        </div>
        <canvas id="canvas" tabindex="-1" oncontextmenu="event.preventDefault()"></canvas>
    </div>

    <div class="controls">
        <span>WASD</span> — движение
        <span>SPACE/ENTER</span> — выбор
        <span>C</span> — персонаж
        <span>M</span> — карта
        <span>R</span> — рестарт
    </div>

    <script type="module">
        // pygbag bootstrap
        const canvas = document.getElementById("canvas");
        const loading = document.getElementById("loading");

        // Hide loading when game starts
        const observer = new MutationObserver(() => {
            if (canvas.width > 1 && canvas.height > 1) {
                loading.style.display = "none";
            }
        });
        observer.observe(canvas, { attributes: true });

        // Load pygbag runtime
        const script = document.createElement("script");
        script.type = "module";
        script.src = "./build/web/game.js";
        script.onload = () => console.log("pygbag loaded");
        script.onerror = () => {
            loading.innerHTML = "<h1>Ошибка загрузки</h1><p>Попробуйте обновить страницу</p>";
        };
        document.head.appendChild(script);
    </script>
</body>
</html>
